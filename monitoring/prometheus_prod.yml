global:
  scrape_interval: 30s
scrape_configs:
  - job_name: gateway
    static_configs: [{targets: ['gateway:8001']}]
  - job_name: writer
    static_configs: [{targets: ['writer:8002']}]
  - job_name: reader
    static_configs: [{targets: ['reader:8003']}]
  - job_name: node
    static_configs: [{targets: ['node-exporter:9100']}]
  - job_name: prometheus
    static_configs: [{targets: ['localhost:9090']}]
