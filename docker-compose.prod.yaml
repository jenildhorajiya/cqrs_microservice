# Single-host ARM64 deployment. Bind all admin interfaces to loopback; use SSH tunnels.
name: cqrs
x-go: &go
  build:
    context: .
    dockerfile: docker/production.Dockerfile
  restart: unless-stopped
  networks: [internal]
  environment: &goenv
    KAFKA_BROKERS: kafka:9092
    JAEGER_HOST: jaeger:6831
services:
  gateway:
    <<: *go
    build: {context: ., dockerfile: docker/production.Dockerfile, args: {SERVICE: api_gateway_service}}
    environment:
      <<: *goenv
      READER_SERVICE: reader:5003
    ports: ["127.0.0.1:5001:5001"]
    depends_on: [reader, writer, kafka]
  writer:
    <<: *go
    build: {context: ., dockerfile: docker/production.Dockerfile, args: {SERVICE: writer_service}}
    environment:
      <<: *goenv
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    depends_on: [postgres, kafka]
  reader:
    <<: *go
    build: {context: ., dockerfile: docker/production.Dockerfile, args: {SERVICE: reader_service}}
    environment:
      <<: *goenv
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      MONGO_URI: mongodb://mongo:27017
      MONGO_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD}
      REDIS_ADDR: redis:6379
    depends_on: [mongo, redis, kafka]
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: products
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [internal]
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD}
    volumes: [mongodata:/data/db]
    networks: [internal]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "192mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [internal]
  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes: [kafkadata:/var/lib/kafka/data]
    networks: [internal]
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    restart: unless-stopped
    environment: {COLLECTOR_ZIPKIN_HOST_PORT: ":9411"}
    ports: ["127.0.0.1:16686:16686"]
    networks: [internal]
  prometheus:
    image: prom/prometheus:v3.4.1
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes: ["./monitoring/prometheus_prod.yml:/etc/prometheus/prometheus.yml:ro", "promdata:/prometheus"]
    ports: ["127.0.0.1:9090:9090"]
    networks: [internal]
  grafana:
    image: grafana/grafana:11.6.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes: [grafanadata:/var/lib/grafana]
    ports: ["127.0.0.1:3005:3000"]
    networks: [internal]
  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    networks: [internal]
volumes:
  pgdata:
  mongodata:
  kafkadata:
  promdata:
  grafanadata:
networks:
  internal:
    driver: bridge
